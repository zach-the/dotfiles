# ==============:===========
# 0. WIPE ALL DEFAULT BINDINGS
# ==========================
# This removes every default Prefix keybinding
unbind -n -a

# ==========================
# 1. General Settings & Prefix
# ==========================
# Set prefix to Ctrl+b
set -g prefix C-b
bind C-b send-prefix
# Enable mouse mode (lets you scroll history with the mouse wheel)
set -g mouse on
# WheelUpPane: If not in copy-mode, enter copy-mode and scroll up
bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'copy-mode -e'"
bind -n WheelDownPane select-pane -t= \; send-keys -M

# Restore mouse bindings lost due to `unbind -n -a`
bind -n MouseDown1Pane select-pane -t= \; send-keys -M
bind -n MouseDrag1Pane if-shell -F -t = "#{mouse_any_flag}" "if -Ft= '#{pane_in_mode}' 'copy-mode -M' 'send-keys -M'" "copy-mode -M"
bind -n C-MouseDrag1Pane if-shell -F -t = "#{mouse_any_flag}" "if -Ft= '#{pane_in_mode}' 'copy-mode -M' 'send-keys -M'" "copy-mode -M"
# bind -n M-MouseDrag1Pane if-shell -F -t = "#{mouse_any_flag}" "if -Ft= '#{pane_in_mode}' 'copy-mode -M' 'send-keys -M'" "copy-mode -M"

# In copy mode, dragging with Ctrl or Alt does a column highlight (rectangular selection)
bind -T copy-mode C-MouseDrag1Pane select-pane \; send-keys -X begin-selection \; send-keys -X rectangle-toggle
# bind -T copy-mode M-MouseDrag1Pane select-pane \; send-keys -X begin-selection \; send-keys -X rectangle-toggle
bind -T copy-mode C-MouseDragEnd1Pane send-keys -X copy-selection-and-cancel
# bind -T copy-mode M-MouseDragEnd1Pane send-keys -X copy-selection-and-cancel

bind -T copy-mode-vi C-MouseDrag1Pane select-pane \; send-keys -X begin-selection \; send-keys -X rectangle-toggle
# bind -T copy-mode-vi M-MouseDrag1Pane select-pane \; send-keys -X begin-selection \; send-keys -X rectangle-toggle
bind -T copy-mode-vi C-MouseDragEnd1Pane send-keys -X copy-selection-and-cancel
# bind -T copy-mode-vi M-MouseDragEnd1Pane send-keys -X copy-selection-and-cancel
bind -n MouseDrag1Border resize-pane -M
bind -n MouseDown1Status select-window -t=
bind -n WheelDownStatus next-window
bind -n WheelUpStatus   previous-window

# Enable double/triple click to select words/lines in normal mode
bind -n DoubleClick1Pane select-pane -t= \; copy-mode -M \; send-keys -X select-word
bind -n TripleClick1Pane select-pane -t= \; copy-mode -M \; send-keys -X select-line
# Fix escape delay (crucial if you use Vim/Neovim)
set -sg escape-time 10
# Increase scrollback buffer size
set -g history-limit 50000
# Enable extended key sequences (CSI u)
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# ==========================
# 2. Window Numbering
# ==========================
# Start windows at 1, not 0
set -g base-index 1
setw -g pane-base-index 1
# Automatically renumber windows when one is closed
set -g renumber-windows on
# Default window name is empty; manual renames override this
setw -g automatic-rename on
setw -g automatic-rename-format ""

# ==========================
# 3. THE ESSENTIAL PREFIX COMMANDS
# ==========================
    # Prefix+w : open window/session picker (fzf-based -- see
    # tmux-choose-tree.sh for why this replaces tmux's built-in choose-tree).
    # J/K jump to the next/previous session; j/k move by window.
bind-key w run-shell '~/dotfiles/tmux/tmux-choose-tree.sh'
    # Prefix+d : detach from session (leaves it running in background)
bind d detach-client
    # Prefix+: : open tmux command prompt
bind : command-prompt
    # Prefix+[ : enter copy/scroll mode
bind [ copy-mode
    # Ctrl+C (no prefix) : enter copy/scroll mode
bind-key -n C-C copy-mode

    # In copy mode, C-u/C-d scroll by 2/5 of a page instead of tmux's default half-page
bind -T copy-mode-vi u run-shell 'tmux send-keys -X -N $(( $(tmux display-message -p "#{pane_height}") * 2 / 5 )) scroll-up'
bind -T copy-mode-vi d run-shell 'tmux send-keys -X -N $(( $(tmux display-message -p "#{pane_height}") * 2 / 5 )) scroll-down'
bind -T copy-mode u run-shell 'tmux send-keys -X -N $(( $(tmux display-message -p "#{pane_height}") * 2 / 5 )) scroll-up'
bind -T copy-mode d run-shell 'tmux send-keys -X -N $(( $(tmux display-message -p "#{pane_height}") * 2 / 5 )) scroll-down'

    # less-style scrolling in bare (emacs) copy mode:
    # f/b = forward/backward a full page, e/y = scroll down/up one line
bind -T copy-mode f send-keys -X page-down
bind -T copy-mode b send-keys -X page-up
bind -T copy-mode e send-keys -X scroll-down
bind -T copy-mode y send-keys -X scroll-up

    # Vim-style visual selection: v = char-wise select, C-v = block-wise select
    # (tmux 3.6a defaults both to rectangle-toggle, which does nothing until a
    # selection is already active)
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X begin-selection \; send-keys -X rectangle-toggle

# ==========================
# 4. Window/Pane Navigation
# ==========================
    # Prefix+Left/Right : previous/next window
bind Left  previous-window
bind Right next-window
    # Prefix+M : move current window to another session via fzf picker (or
    # create a brand-new session, named via a prompt, to move it into)
bind-key M run-shell '~/dotfiles/tmux/tmux-move-window.sh "#{session_name}:#{window_index}"'
    # Prefix+m : move current pane to another window in this session (or a
    # brand-new window) via fzf picker
bind-key m run-shell 'dst=$(printf "%s\n%s" "+ new window" "$(tmux list-windows -t "#{session_name}" -F "##{window_index}: ##{window_name}" | grep -v "^#{window_index}:")" | fzf-tmux -p 60%,40% -- --reverse --cycle --prompt="Move pane to: "); if [ "$dst" = "+ new window" ]; then tmux break-pane -s "#{session_name}:#{window_index}.#{pane_index}" -t "#{session_name}:"; elif [ -n "$dst" ]; then tmux move-pane -s "#{session_name}:#{window_index}.#{pane_index}" -t "#{session_name}:$(echo "$dst" | cut -d: -f1)"; fi; true'

    # Ctrl+T : open a new window
bind-key -n C-T new-window
# bind-key -n M-t new-window
    # Ctrl+W : kill pane (with confirm banner if a process is running, or if
    # the session (section 7) or this specific pane (section 6) is protected).
    # confirm-before's single-line prompt lives in the same status-line
    # message area as tmux-notify, styled via message-style/message-command-style
    # above (section 5), and still takes a bare y/n keypress -- no Enter needed.
bind-key -n C-W if-shell -F '#{||:#{?#{==:#{pane_current_command},bash},0,#{?#{==:#{pane_current_command},zsh},0,#{?#{==:#{pane_current_command},fish},0,#{?#{==:#{pane_current_command},sh},0,#{?#{==:#{pane_current_command},dash},0,1}}}}},#{||:#{@protected},#{@pane_protected}}}' \
    "confirm-before -p \"#{?#{@protected},This session is protected.,#{?#{@pane_protected},This pane is protected.,Process '#{pane_current_command}' is running.}} Kill pane? (y/n)\" \"run-shell '~/dotfiles/tmux/tmux-kill-pane.sh #{pane_id} #{window_id}'\"" \
    "run-shell \"~/dotfiles/tmux/tmux-kill-pane.sh #{pane_id} #{window_id}\""
# bind-key -n M-w kill-pane \; select-layout -E \; refresh-client
    # Ctrl+H/L (or Ctrl+Shift+Left/Right) : previous/next window
bind-key -n C-H       previous-window
bind-key -n C-S-Left  previous-window
bind-key -n C-L       next-window
bind-key -n C-S-Right next-window
    # Ctrl+R : rename current window
bind-key -n C-R command-prompt -I "#W" "rename-window '%%'"

# Pane splits and layout
    # Alt+- : split vertically (new pane below); equalize heights among siblings
    # in that column only (matched by exact geometry, not tree depth)
bind-key -n M-- run-shell "~/dotfiles/tmux/tmux-split-pane.sh -v #{pane_id}"
    # Alt+\ or Alt+/ : split horizontally (new pane to the right); equalize widths
    # among siblings in that row only (matched by exact geometry, not tree depth)
bind-key -n M-\\ run-shell "~/dotfiles/tmux/tmux-split-pane.sh -h #{pane_id}"
bind-key -n M-/ run-shell "~/dotfiles/tmux/tmux-split-pane.sh -h #{pane_id}"
    # Alt+= : equalize all pane sizes
bind-key -n M-= select-layout -E
    # Alt+w : grow current pane to 2/3 of its row's width; equalize the
    # rest of that row's panes in the space left over
bind-key -n M-w run-shell "~/dotfiles/tmux/tmux-resize-pane.sh 67 #{pane_id}"
    # Alt+a : shrink current pane to 1/3 of its row's width; equalize the
    # rest of that row's panes in the space left over
bind-key -n M-a run-shell "~/dotfiles/tmux/tmux-resize-pane.sh 33 #{pane_id}"
    # Alt+z : resize current pane to 1/2 of its row's width; equalize the
    # rest of that row's panes in the space left over
bind-key -n M-z run-shell "~/dotfiles/tmux/tmux-resize-pane.sh 50 #{pane_id}"
    # Prefix+s : toggle split direction between horizontal and vertical
bind-key s if-shell -F '#{==:#{@split_dir},h}' 'set-window-option @split_dir v ; select-layout even-vertical' 'set-window-option @split_dir h ; select-layout even-horizontal'

# Pane focus (no prefix)
    # Alt+h/j/k/l (or Alt+Left/Down/Up/Right) : move focus left/down/up/right (no-ops at edges)
bind-key -n M-h    if-shell -F '#{pane_at_left}'   '' 'select-pane -L'
bind-key -n M-Left if-shell -F '#{pane_at_left}'   '' 'select-pane -L'
bind-key -n M-j    if-shell -F '#{pane_at_bottom}' '' 'select-pane -D'
bind-key -n M-Down if-shell -F '#{pane_at_bottom}' '' 'select-pane -D'
bind-key -n M-k  if-shell -F '#{pane_at_top}'    '' 'select-pane -U'
bind-key -n M-Up if-shell -F '#{pane_at_top}'    '' 'select-pane -U'
bind-key -n M-l     if-shell -F '#{pane_at_right}'  '' 'select-pane -R'
bind-key -n M-Right if-shell -F '#{pane_at_right}'  '' 'select-pane -R'

# Pane broadcasting (prefix)
    # Prefix+b : toggle synchronized input to all panes in this window
bind-key b set-window-option synchronize-panes \; display-message "broadcast: #{?synchronize-panes,on,off}"
    # Prefix+o : toggle opacity mode live, transparent <-> solid (see
    # tmux-cycle-opacity.sh)
bind-key o run-shell '~/dotfiles/tmux/tmux-cycle-opacity.sh'

# Pane/window reordering (prefix)
    # Prefix+h/l (or Prefix+Shift+Left/Right) : shift current window left/right
    # in the tab bar. Plain Prefix+Left/Right are already taken (previous/next
    # window, above), so this uses Shift+arrow instead.
bind h swap-window -t -1 \; select-window -t -1
bind S-Left swap-window -t -1 \; select-window -t -1
bind l swap-window -t +1 \; select-window -t +1
bind S-Right swap-window -t +1 \; select-window -t +1
    # Prefix+H/L (or Prefix+Shift+Up/Down) : swap current pane with the one
    # above/below. Plain Prefix+Up/Down are left alone -- they still carry
    # tmux's built-in select-pane -U/-D.
bind H swap-pane -U
bind S-Up swap-pane -U
bind L swap-pane -D
bind S-Down swap-pane -D

# ==========================
# 5. Status Bar 
# ==========================

source-file ~/dotfiles/tmux/tmux-colors.conf

# Opacity mode: toggled via Prefix+o (see tmux-cycle-opacity.sh).
#   transparent -- everything punches through WezTerm's window opacity
#                  (bg=default), including pane borders, status bar, and
#                  popups.
#   solid       -- everything fills with @background regardless of WezTerm's
#                  opacity, and inactive panes are dimmed.
# Defaults to solid on a fresh server only (guarded so an ordinary Prefix+0
# reload doesn't stomp a live Prefix+o toggle).
%if "#{==:#{@opacity_mode},}"
set -g @opacity_mode solid
%endif

set -g status-position top
    # "PROTECTED" indicator, shown when the attached session has protection
    # toggled on via Prefix+P (see section 7)
set -g status-right "#{?#{@protected},#[fg=colour1] PROTECTED ,}"
set -g status-left ""
set -g window-status-separator ""

    # Status-line messages (e.g. tmux's built-in "no next window" notice),
    # styled blue (same blue as the synchronize-panes tab indicator) instead
    # of tmux's default black/yellow
set -g message-style "bg=colour4,fg=#{@background}"
set -g message-command-style "bg=colour4,fg=#{@background}"

%if "#{==:#{@opacity_mode},transparent}"
set -g status-style "bg=default"
set -g window-status-format "#[bg=default,fg=#{@grey}]░▒▓#[bg=#{@grey},fg=#{@background}] #{?window_name,#W,#I} #[bg=default,fg=#{@grey}]▓▒░"
set -g window-status-current-format "#[bg=default,fg=#{?synchronize-panes,colour4,#{@pink}}]░▒▓#[bg=#{?synchronize-panes,colour4,#{@pink}},fg=#{@background}] #{?window_name,#W,#I} #[bg=default,fg=#{?synchronize-panes,colour4,#{@pink}}]▓▒░"
set -g pane-border-style "fg=#{@grey},bg=default"
set -g pane-active-border-style "fg=#{@pink},bg=default"
    # Popups (e.g. the fzf window picker) have their own style options,
    # separate from pane-border-style above -- without these tmux falls
    # back to its own opaque default fill instead of the bg=default
    # passthrough that makes everything else transparent.
set -g popup-style "bg=default"
set -g popup-border-style "fg=#{@grey},bg=default"
%else
set -g status-style "bg=#{@background}"
set -g window-status-format "#[bg=#{@background},fg=#{@grey}]░▒▓#[bg=#{@grey},fg=#{@background}] #{?window_name,#W,#I} #[bg=#{@background},fg=#{@grey}]▓▒░"
set -g window-status-current-format "#[bg=#{@background},fg=#{?synchronize-panes,colour4,#{@pink}}]░▒▓#[bg=#{?synchronize-panes,colour4,#{@pink}},fg=#{@background}] #{?window_name,#W,#I} #[bg=#{@background},fg=#{?synchronize-panes,colour4,#{@pink}}]▓▒░"
set -g pane-border-style "fg=#{@grey},bg=#{@background}"
set -g pane-active-border-style "fg=#{@pink},bg=#{@background}"
set -g popup-style "bg=#{@background}"
set -g popup-border-style "fg=#{@grey},bg=#{@background}"
%endif

set -g pane-border-lines single # single, double, heavy, simple, number

# Pane labels: banner along each pane's top border showing its label (set via
# Prefix+r). Stored in a pane-scoped custom variable (@pane_label) rather
# than the built-in pane_title -- pane_title defaults to the local hostname
# until something sets it, which would show up in the banner as if it were
# a real label; @pane_label has no default at all, so the banner is only
# ever non-blank once you've actually set one.
#
# The same banner right-aligns "(protected)" when a pane is individually
# protected via Prefix+p (section 6), and the pane's index number when
# toggled on via Prefix+n (@show_pane_numbers, session-wide). @pane_protected
# is a separate pane-scoped variable from section 7's session-level
# @protected -- the two are deliberately unrelated (per-pane marker vs
# per-session kill-guard).
set -g pane-border-status top
set -g pane-border-format "#{?#{@pane_label},#[fg=#{?pane_active,#{@pink},#{@grey}}] #{@pane_label} ,}#[align=right]#{?#{@pane_protected},#[fg=#{?pane_active,#{@pink},#{@grey}}] (protected) ,}#{?#{@show_pane_numbers},#[fg=#{?pane_active,#{@pink},#{@grey}}] #{pane_index} ,}"

# Enable RGB true color support
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
%if "#{==:#{@opacity_mode},transparent}"
    # bce (background color erase) must stay enabled for transparency to
    # apply to erased/blank cells, not just explicitly styled text -- see
    # section notes above
%else
set -ag terminal-overrides ",xterm-256color:bce@"
%endif

# Dim unfocused panes
%if "#{==:#{@opacity_mode},transparent}"
    # Deliberately left unset here (instead of bg=default): setting
    # window-style/window-active-style at all makes tmux actively repaint
    # every cell in the pane with a resolved color, even when told
    # "bg=default" -- which apparently isn't the same as a cell WezTerm has
    # never touched. Only genuinely untouched cells get alpha-blended with
    # the desktop; tmux-painted ones render opaque regardless of which
    # color they were painted with. So in transparent mode we skip the
    # dim-inactive-pane tint entirely and let pane content pass through
    # untouched. Explicitly unset (not just "not set") in case a prior
    # reload with @opacity_mode=solid already applied a fill.
set -gu window-style
set -gu window-active-style
%else
set -g window-style 'fg=#{?synchronize-panes,#{@white},#{@grey}},bg=#{?synchronize-panes,#{@background},#{@dim_background}}'
set -g window-active-style 'fg=#{@white},bg=#{@background}'
%endif

# ==========================
# 6. Reloading & Renaming
# ==========================
    # Prefix+0 : reload tmux config
bind 0 run-shell '~/dotfiles/tmux/tmux-reload.sh'
    # Prefix+R : rename current (or parent grouped) session
bind R run-shell 'current="#{session_name}"; group="#{session_group}"; if [ -n "$group" ]; then parent=$(tmux list-sessions -F "##{session_name}" -f "##{==:##{session_group},$group}" | grep -v "^$current$" | head -1); fi; [ -z "$parent" ] && parent="$current"; tmux command-prompt -I "$parent" "rename-session -t \"$parent\" %%"'
    # Prefix+r : set/rename the current pane's label (shown in its border banner)
bind r command-prompt -I "#{@pane_label}" -p "pane label:" "set-option -p @pane_label '%%'"
    # Prefix+p : toggle protection for just the current pane, shown as
    # "(protected)" on its border banner and covered by the Ctrl+W
    # kill-confirm guard above. Refuses (with a notice) if the whole session
    # is already protected via Prefix+P (section 7) -- pane-level protection
    # would be redundant on top of that.
bind p if-shell -F '#{@protected}' \
    'display-message "session already protected"' \
    'if-shell -F "#{@pane_protected}" "set-option -pu @pane_protected" "set-option -p @pane_protected 1"'
    # Prefix+n : toggle each pane's index number in the upper-right corner of
    # its border banner (session-wide, not per-pane, so it applies uniformly)
bind n if-shell -F '#{@show_pane_numbers}' \
    'set-option -gu @show_pane_numbers' \
    'set-option -g @show_pane_numbers 1'

# ==========================
# 7. Session Protection
# ==========================
    # Prefix+P : toggle protection for the current session. While on, any
    # pane kill (Ctrl+W) requires confirmation, and a "PROTECTED" indicator
    # shows on the right of the status bar.
bind P run-shell '~/dotfiles/tmux/tmux-toggle-protect.sh'
