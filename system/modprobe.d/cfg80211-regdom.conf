# Force the initial regulatory domain to US at module load time.
#
# The iwlwifi card is a self-managed wiphy: `iw reg set` is rejected
# (-EPERM) for it, and the only thing that can change its regulatory
# domain afterward is hostapd's own `country_code=` directive when
# starting an AP. That path races against itself — hostapd caches its
# channel list once at init, then the 00->US country transition lands
# a moment later, so 5GHz channels like 36 are missing from the stale
# list and hostapd dies ("Hardware does not support configured
# channel"). Booting with the domain already US avoids the transition
# entirely. See the iPhoneTransfer hotspot scripts in /usr/local/bin.
options cfg80211 ieee80211_regdom="US"
