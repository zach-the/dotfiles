# Don't autoload the webcam stack at boot. It grabs a GPIO that the four
# cs35l56 speaker amps need at probe time (-EBUSY "Failed to get spk-id-gpios"),
# so if it wins the race the sound card never registers (only "Dummy Output").
# webcam-late-load.service loads these once the sound card is up.
# (Blacklist only stops alias autoload; explicit `modprobe` still works.)
blacklist intel_cvs
blacklist ov08x40
blacklist intel_ipu7_isys
